pointcloud_to_laserscan:
  ros__parameters:
    target_frame: base_link
    transform_tolerance: 0.01
    min_height: -0.1
    max_height: 0.5
    angle_min: -3.14
    angle_max: 3.14
    angle_increment: 0.0087  # M_PI/360.0
    scan_time: 0.25
    range_min: 0.10
    range_max: 20.0
    use_inf: true
    inf_epsilon: 1.0